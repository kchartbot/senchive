name: compose
on:
  workflow_dispatch:
    inputs:
      event: {description: "일정 이름(비우면 오늘 전체)", default: "인기가요"}
      pages: {description: "갤러리별 목록 페이지 수", default: "4"}
      dry: {description: "true면 올리지 않고 조립만", default: "true"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install requests beautifulsoup4 pillow
      - run: python tools/compose.py
        env:
          EVENT_NAME: ${{ inputs.event }}
          PAGES: ${{ inputs.pages }}
      - name: save result to compose-data branch
        if: always()
        run: |
          [ -d out ] || exit 0
          cd out && git init -q -b compose-data && git add -A
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -q -m "compose $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" compose-data
