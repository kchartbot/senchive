name: fan-match
on:
  workflow_dispatch:
    inputs:
      ev_t: {description: "오늘 행사 유사도 기준값 (비우면 자동 계산)", default: ""}
      mg_t: {description: "멤버 차이 기준값 (비우면 자동 계산)", default: ""}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: fansign-scan 결과 가져오기
        run: git fetch -q origin fan-data && mkdir -p out/fan && git --work-tree=out/fan checkout origin/fan-data -- . && git reset -q && ls out/fan | head
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-nanum
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers pillow "opencv-python-headless==4.10.0.84" "numpy<2.3"
          python -c "import cv2; print(cv2.__version__, cv2.__file__, hasattr(cv2, \"CascadeClassifier\"))"
      - env:
          EV_T: ${{ inputs.ev_t }}
          MG_T: ${{ inputs.mg_t }}
        run: python tools/fan_match.py
      - name: match-data 브랜치에 저장
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf out/match/_fr; cd out/match && git init -q -b match-data
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm match
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -qf origin match-data
