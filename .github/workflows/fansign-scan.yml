name: fansign-scan
on:
  workflow_dispatch:
    inputs:
      wstart: {description: "시작 HH:MM (오늘, 한국시간)", default: "18:00"}
      listonly: {description: "목록만 보고 분류 결과 출력 (비우면 본문까지 수집)", default: "1"}
      showmem: {description: "점검용: 이 멤버가 나온 글 전부 표시", default: ""}
      day: {description: "날짜 YYYY.MM.DD (비우면 오늘)", default: ""}
      min_no: {description: "이 글번호 이상만 (전체 글 훑기, 비우면 팬싸 키워드 검색)", default: ""}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install requests beautifulsoup4 pillow
      - env:
          WSTART: ${{ inputs.wstart }}
          MIN_NO: ${{ inputs.min_no }}
          LISTONLY: ${{ inputs.listonly }}
          SHOWMEM: ${{ inputs.showmem }}
          DAY: ${{ inputs.day }}
        run: python tools/fansign_scan.py
      - name: fan-data 브랜치에 저장
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/fan && git init -q -b fan-data
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm fan
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -qf origin fan-data
