name: in-best
on:
  workflow_dispatch:
    inputs:
      nos: {description: "글 번호(쉼표)", default: "177435"}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - env:
          NOS: ${{ inputs.nos }}
        run: python tools/in_best.py
