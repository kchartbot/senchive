name: review-scan
on:
  workflow_dispatch:
    inputs:
      since:
        description: "이 날짜부터 (YYYY.MM.DD, 비우면 오늘)"
        default: ""
permissions:
  contents: write
concurrency:
  group: review-scan
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install requests beautifulsoup4 pillow
      - env:
          SINCE: ${{ inputs.since }}
          DELAY: "0.8"
        run: python tools/review_scan.py
      - name: review-scan 브랜치에 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/review && git init -q -b review-scan
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm scan
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -qf origin review-scan
