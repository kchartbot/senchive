name: review-scan
on:
  workflow_dispatch:
    inputs:
      since:
        description: "이 날짜부터 (YYYY.MM.DD, 비우면 오늘)"
        default: ""
      pages:
        description: "훑을 목록 페이지 수 (기본 12)"
        default: "12"
      maxposts:
        description: "읽을 글 최대 개수 (0이면 제한 없음)"
        default: "0"
      include:
        description: "포함 키워드(쉼표, 비우면 기본값)"
        default: ""
      exclude:
        description: "제외 키워드(쉼표, 비우면 기본값)"
        default: ""
      other:
        description: "다른 그룹 키워드(쉼표, 비우면 기본값)"
        default: ""
      bait:
        description: "떡밥 키워드(쉼표, 비우면 기본값)"
        default: ""
      recommend:
        description: "개념글만 (true/false)"
        default: "true"
      incremental:
        description: "지난 결과 재사용, 새 글만 읽기 (true/false)"
        default: "true"
      headoff:
        description: "건너뛸 말머리(쉼표)"
        default: ""
permissions:
  contents: write
concurrency:
  group: review-scan
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 입력 검사
        env:
          S: ${{ inputs.since }}
          A: ${{ inputs.include }}
          B: ${{ inputs.exclude }}
          C: ${{ inputs.other }}
          D: ${{ inputs.bait }}
          N1: ${{ inputs.pages }}
          N2: ${{ inputs.maxposts }}
          R: ${{ inputs.recommend }}
          I2: ${{ inputs.incremental }}
          H: ${{ inputs.headoff }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          if os.environ["S"] and not re.fullmatch(r"\d{4}\.\d{2}\.\d{2}", os.environ["S"]): sys.exit("잘못된 날짜")
          for k in ("N1", "N2"):
              if not re.fullmatch(r"\d{1,3}", os.environ[k]): sys.exit("잘못된 숫자: " + k)
          if os.environ["R"] not in ("true", "false") or os.environ["I2"] not in ("true", "false"): sys.exit("잘못된 개념글 값")
          for k in "ABCDH":
              v = os.environ[k]
              if len(v) > 1200 or re.search(r"[\"'`$\\<>|;&\n\r]", v): sys.exit("잘못된 키워드: " + k)
          PY
      - uses: actions/checkout@v4
      - name: 이전 결과 가져오기
        if: inputs.incremental == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 -b review-scan "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" out/review || echo "이전 결과 없음"
          rm -rf out/review/.git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install requests beautifulsoup4 pillow
      - env:
          SINCE: ${{ inputs.since }}
          MAXP: ${{ inputs.pages }}
          MAXPOSTS: ${{ inputs.maxposts }}
          KW_INCLUDE: ${{ inputs.include }}
          KW_EXCLUDE: ${{ inputs.exclude }}
          KW_OTHER: ${{ inputs.other }}
          KW_BAIT: ${{ inputs.bait }}
          RECOMMEND: ${{ inputs.recommend }}
          INCREMENTAL: ${{ inputs.incremental }}
          HEAD_OFF: ${{ inputs.headoff }}
          DELAY: "0.8"
        run: python tools/review_scan.py
      - name: review-scan 브랜치에 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/review && git init -q -b review-scan
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm scan
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -qf origin review-scan
