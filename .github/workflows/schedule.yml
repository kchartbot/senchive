name: schedule
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 스케줄 수집
        env:
          SECRET_DATA_URL: ${{ secrets.SECRET_DATA_URL }}
        run: node tools/schedule_scraper.mjs
      - name: schedule-data 브랜치에 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q -b schedule-data
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule_data.json && git commit -qm "schedule $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -qf origin schedule-data
