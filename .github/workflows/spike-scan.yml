name: spike-scan
on:
  workflow_dispatch:
    inputs:
      span_h: {description: "최근 몇 시간을 볼지", default: "4"}
      lookback_min: {description: "급증 직전 몇 분의 개념글을 볼지", default: "90"}
      minhits: {description: "키워드가 제목에 몇 번 나와야 추가할지", default: "5"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - env:
          SPAN_H: ${{ inputs.span_h }}
          LOOKBACK_MIN: ${{ inputs.lookback_min }}
          MINHITS: ${{ inputs.minhits }}
        run: python tools/spike_scan.py
