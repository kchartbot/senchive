name: topic-scan
on:
  workflow_dispatch:
    inputs:
      since:
        description: "이 날짜부터 (YYYY.MM.DD)"
        default: "2026.11.02"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - env:
          SINCE: ${{ inputs.since }}
        run: python tools/topic_scan.py
      - name: topic-data 브랜치에 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q -b topic-data
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.json && git commit -qm "topics"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -qf origin topic-data
