name: window-scan
on:
  workflow_dispatch:
    inputs:
      wstart: {description: "시작 HH:MM (한국시간, 오늘)", default: "19:30"}
      wend: {description: "끝 HH:MM", default: "22:00"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install requests beautifulsoup4 pillow
      - env:
          WSTART: ${{ inputs.wstart }}
          WEND: ${{ inputs.wend }}
        run: python tools/window_scan.py
      - name: window-data 브랜치에 저장
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/win && git init -q -b window-data
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "window" 
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -qf origin window-data
