name: yt-test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp
      - name: 공개 영상 구간 받기 시도 (쿠키/우회 없음)
        run: |
          mkdir t && cd t
          yt-dlp --no-playlist -f "bv*[height<=720]+ba/b[height<=720]" --download-sections "*10-14" --force-keyframes-at-cuts -o "clip.%(ext)s" "https://www.youtube.com/watch?v=5zqZvkkkJ2E" 2>&1 | tail -15 || true
          ls -la
          for f in clip.*; do [ -f "$f" ] && ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,duration -of csv=p=0 "$f"; done || true
