<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영상 편집기</title>
<style>
:root{--bg:#141518;--pan:#1d1f24;--pan2:#262930;--line:#33373f;--tx:#e8eaee;--dim:#98a0ad;--ac:#5b7cff;--ac2:#3f5ad6;--rd:#d24b4b;--gr:#3fbf7f;--ye:#ffd24a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 "Malgun Gothic",system-ui,sans-serif;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--pan2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:#566}button.p{background:var(--ac);border-color:var(--ac)}button.p:hover{background:var(--ac2)}button.d{color:#ff8f8f}
button.on{background:var(--ac);border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
input,select,textarea{background:#111317;border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
input[type=range]{padding:0;accent-color:var(--ac);width:100%}input[type=color]{padding:0;height:26px;width:42px;cursor:pointer}input[type=checkbox]{accent-color:var(--ac)}
textarea{width:100%;resize:vertical;user-select:text}input[type=text],input[type=number]{user-select:text}
small,.dim{color:var(--dim)}kbd{background:var(--pan2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
#app{display:grid;height:100vh;grid-template-rows:44px minmax(0,1fr) 292px;grid-template-columns:250px minmax(0,1fr) 316px;gap:8px;padding:0 8px 8px;grid-template-areas:"top top top" "lib stage prop" "tl tl tl"}
header{grid-area:top;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);margin:0 -8px;padding:0 10px;background:var(--pan)}
header h1{font-size:15px;margin:0 10px 0 0}header .sp{flex:1}
.box{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:0;min-width:0;display:flex;flex-direction:column}
.box>h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:8px}
#lib{grid-area:lib}#stagebox{grid-area:stage}#prop{grid-area:prop;overflow:auto}#tl{grid-area:tl;padding:0}
#libl{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.mi{display:flex;gap:8px;background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:5px;align-items:center;cursor:pointer}
.mi:hover{border-color:var(--ac)}.mi img{width:64px;height:40px;object-fit:cover;background:#000;border-radius:4px}.mi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .st{font-size:11px;color:var(--dim)}.empty{color:var(--dim);padding:14px 4px;text-align:center}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b0c0e;border-radius:8px;position:relative;overflow:hidden}
#cv{background:#000;touch-action:none;display:block}
#vid{position:absolute;left:-9999px;width:2px;height:2px}
#tp{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}#tp .tc{font:14px ui-monospace,Consolas,monospace;min-width:150px}
.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}.row label{width:64px;color:var(--dim);flex:none}.row .v{width:46px;text-align:right;color:var(--dim);flex:none;font-size:12px}
.row input[type=range]{flex:1;min-width:60px}.sec{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}.sec>b{font-size:12px;color:var(--dim)}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chips button{padding:2px 8px;font-size:12px}
/* 타임라인 */
#tlh{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#tlw{flex:1;display:grid;grid-template-columns:62px minmax(0,1fr);min-height:0}
#gut{border-right:1px solid var(--line);padding-top:24px}#gut div{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;border-bottom:1px solid #262930}
#gut .gv{height:60px}#gut .gt{height:34px}#gut .gm{height:34px}
#tsc{overflow:auto;position:relative;min-height:0}#tin{position:relative;min-height:100%}
#ruler{height:24px;position:sticky;top:0;z-index:5;background:var(--pan);border-bottom:1px solid var(--line);cursor:pointer}
#ruler i{position:absolute;top:0;bottom:0;border-left:1px solid #444;font-style:normal;font-size:10px;color:var(--dim);padding-left:3px}
.lane{position:relative;border-bottom:1px solid #262930}.lane.v{height:60px}.lane.t,.lane.m{height:34px}
.cl{position:absolute;top:3px;bottom:3px;border:2px solid #4a5aa8;border-radius:6px;background:#2a3158;overflow:hidden;cursor:grab}
.cl.sel{border-color:var(--ye)}.cl .ths{display:flex;position:absolute;inset:0;opacity:.8}.cl .ths img{height:100%;object-fit:cover;pointer-events:none;flex:none}
.cl .lb{position:absolute;left:6px;top:2px;right:6px;font-size:11px;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.cl .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.18)}.cl .h.l{left:0}.cl .h.r{right:0}.cl .h:hover{background:var(--ye)}
.cl.ov{top:3px;bottom:3px;background:#3a5f3c;border-color:#4f8f53}.cl.ov.mz{background:#6b4a2a;border-color:#a8743c}.cl.ov .lb{top:5px}
#ph{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #ff4d4d;z-index:6;pointer-events:none}
#ph::before{content:"";position:absolute;top:0;left:-7px;border:6px solid transparent;border-top:9px solid #ff4d4d}
#ins{position:absolute;top:24px;height:60px;width:3px;background:var(--ye);z-index:7;display:none;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}.modal.on{display:flex}
.card{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(520px,94vw);max-height:92vh;overflow:auto}
.card h2{margin:0 0 10px;font-size:16px}.bar{height:12px;background:#111;border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:var(--ac)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:8px 14px;border-radius:8px;display:none;z-index:60;max-width:80vw}
</style></head><body>
<div id="app">
<header><h1>🎬 영상 편집기</h1>
 <button id="bOpen" class="p">＋ 영상 열기</button><button id="bProjOpen">프로젝트 열기</button><button id="bProjSave">프로젝트 저장</button>
 <button id="bUndo" title="실행 취소 (Ctrl+Z)">↶</button><button id="bRedo" title="다시 실행 (Ctrl+Y)">↷</button><button id="bRestore" style="display:none">이전 작업 복원</button>
 <span class="sp"></span><small id="hint">Space 재생 · S 분할 · Del 삭제 · ←→ 프레임 · Ctrl+Z 취소 · +/− 확대</small><button id="bExport" class="p">내보내기 ▸</button></header>

<section class="box" id="lib"><h3>보관함 <small id="libn"></small></h3><div id="libl"><div class="empty">영상을 열면 여기에 쌓입니다.<br>눌러서 타임라인 끝에 붙입니다.</div></div></section>

<section class="box" id="stagebox"><div id="stage"><canvas id="cv" width="960" height="540"></canvas><video id="vid" playsinline preload="auto"></video></div>
 <div id="tp"><button id="bPlay" class="p" style="width:64px">▶</button><button id="bPrev" title="1프레임 뒤로">◀|</button><button id="bNext" title="1프레임 앞으로">|▶</button>
  <span class="tc" id="tc">0:00.00 / 0:00.00</span><span style="flex:1"></span><label class="dim"><input type="checkbox" id="loopSel"> 선택 클립 반복</label><small id="pvinfo"></small></div></section>

<section class="box" id="prop"><h3 id="ph3">속성</h3><div id="pbody"></div></section>

<section class="box" id="tl"><div id="tlh">
 <button id="bSplit" title="재생 위치에서 자르기 (S)">✂ 분할</button><button id="bDup">복제</button><button id="bDel" class="d">삭제</button>
 <span class="dim">|</span><button id="bText">T 문구 추가</button><button id="bMos">▦ 모자이크 추가</button>
 <span style="flex:1"></span><label class="dim">확대 <input id="zoom" type="range" min="10" max="400" value="60" style="width:130px"></label><button id="bFit">전체 보기</button></div>
 <div id="tlw"><div id="gut"><div class="gv">영상</div><div class="gt">문구</div><div class="gm">모자이크</div></div>
 <div id="tsc"><div id="tin"><div id="ruler"></div><div class="lane v" id="lv"></div><div class="lane t" id="lt"></div><div class="lane m" id="lm"></div><div id="ph"></div><div id="ins"></div></div></div></div></section>
</div>

<div class="modal" id="mExp"><div class="card"><h2>내보내기</h2><div id="expForm">
 <div class="row"><label>형식</label><select id="xFmt"><option value="mp4">MP4 (영상+소리)</option><option value="gif">GIF (움짤)</option><option value="webp">WebP (움짤)</option></select></div>
 <div class="row"><label>가로 크기</label><select id="xW"></select><small id="xWh"></small></div>
 <div class="row"><label>초당 프레임</label><input id="xFps" type="number" min="1" max="60" value="30" style="width:70px"></div>
 <div class="row" data-f="mp4"><label>화질</label><select id="xQ"><option value="17">최고</option><option value="20" selected>높음</option><option value="24">보통</option><option value="28">작은 용량</option></select></div>
 <div class="row" data-f="mp4"><label>소리</label><label style="width:auto;color:inherit"><input type="checkbox" id="xAudio" checked> 소리 포함</label></div>
 <div class="row" data-f="gif"><label>GIF 화질</label><select id="xGq"><option value="best">프레임별 256색 (최고)</option><option value="diff">전체 256색 (작은 용량)</option></select></div>
 <div class="row" data-f="webp"><label>WebP 화질</label><input id="xWq" type="range" min="30" max="100" value="80"></div>
 <div class="row"><small id="xInfo"></small></div>
 <div class="row" style="justify-content:flex-end"><button id="xCancel">닫기</button><button id="xGo" class="p">저장 위치 고르고 시작</button></div></div>
 <div id="expRun" style="display:none"><div id="xMsg">준비 중…</div><div class="bar"><i id="xBar"></i></div><div class="row" style="justify-content:flex-end"><button id="xStop" class="d">취소</button><button id="xOpen" style="display:none">폴더 열기</button><button id="xClose" style="display:none" class="p">닫기</button></div></div></div></div>
<div id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const rid=p=>p+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let API=null;
function devApi(){return new Proxy({},{get:(_,m)=>(...a)=>fetch('/rpc/'+m,{method:'POST',body:JSON.stringify(a)}).then(r=>r.json())})}
const ready=new Promise(res=>{const ok=()=>{API=window.pywebview.api;res()};
  if(window.pywebview&&window.pywebview.api)ok();else{window.addEventListener('pywebviewready',ok,{once:true});
    if(location.protocol.startsWith('http'))setTimeout(()=>{if(!API){API=devApi();res()}},1200)}});

/* ================= 상태 ================= */
let P={canvas:{w:1280,h:720,fit:"fit"},fps:30,media:{},clips:[],texts:[],mosaics:[]};
const URLS={},THUMBS={};            // 미디어 id -> 재생 주소 / 썸네일 목록 (저장하지 않음)
let SEL=null,T=0,PPS=60,playing=false,FONTS=[];
let hist=[],hpos=-1,hTimer=null,saveTimer=null;
const snap=()=>JSON.stringify(P);
function touch(now){render();clearTimeout(hTimer);hTimer=setTimeout(pushHist,now?0:350);clearTimeout(saveTimer);saveTimer=setTimeout(()=>{API&&API.autosave&&API.autosave(P)},1500)}
function pushHist(){const s=snap();if(hist[hpos]===s)return;hist=hist.slice(0,hpos+1);hist.push(s);if(hist.length>120)hist.shift();hpos=hist.length-1;updUndo()}
function updUndo(){$("bUndo").disabled=hpos<=0;$("bRedo").disabled=hpos>=hist.length-1}
function undo(){clearTimeout(hTimer);pushHist();if(hpos<=0)return;hpos--;P=JSON.parse(hist[hpos]);fixSel();updUndo();render();seek(T)}
function redo(){if(hpos>=hist.length-1)return;hpos++;P=JSON.parse(hist[hpos]);fixSel();updUndo();render();seek(T)}
function fixSel(){if(SEL&&!find(SEL))SEL=null}
function find(s){return s&&(s.t==="c"?P.clips:s.t==="t"?P.texts:P.mosaics).find(x=>x.id===s.id)}
const speedOf=c=>Math.max(.05,+c.speed||1),cdur=c=>Math.max(.04,(c.out-c.in)/speedOf(c));
function layout(){let t=0;return P.clips.map(c=>{const o={c,s:t,e:t+cdur(c)};t=o.e;return o})}
const total=()=>P.clips.reduce((a,c)=>a+cdur(c),0);
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60);return m+":"+(t-m*60).toFixed(2).padStart(5,"0")};
function toast(m,ms=2600){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",ms)}

/* ================= 보관함 ================= */
async function addMedia(list){
  for(const m of list){
    P.media[m.id]={path:m.path,name:m.name,dur:m.dur,w:m.w,h:m.h,fps:m.fps,audio:m.audio};URLS[m.id]=m.url;
    if(!THUMBS[m.id])makeThumbs(m.id);
  }
  renderLib();
}
async function openFiles(){
  const r=await API.open_files();if(!r||!r.length)return;
  const first=!P.clips.length;await addMedia(r);
  if(first){const m=r[0];P.canvas.w=m.w>=m.h?(m.w>=1920?1920:1280):720;P.canvas.h=m.w>=m.h?Math.round(P.canvas.w*m.h/m.w/2)*2:1280;if(m.w<m.h){P.canvas.w=720;P.canvas.h=1280}P.fps=Math.min(60,Math.round(m.fps)||30)}
  for(const m of r)appendClip(m.id,false);
  touch(true);seek(0);$("bFit").click();toast(r.length+"개 영상을 타임라인에 넣었습니다.");
  pollReady(r.filter(m=>!m.ready).map(m=>m.id));
}
function appendClip(mid,doTouch=true){const m=P.media[mid];P.clips.push({id:rid("c"),mid,in:0,out:m.dur,speed:1,vol:1,mute:false,crop:{l:0,t:0,r:0,b:0},rot:0,fh:false,fv:false,fi:0,fo:0});if(doTouch){touch(true);}}
async function pollReady(ids){
  if(!ids.length)return;const left=[];
  const st=await API.media_ready(ids);
  for(const id of ids){const s=st[id];if(!s)continue;if(s.ready){URLS[id]=s.url;renderLib();seek(T)}else left.push(id)}
  if(left.length)setTimeout(()=>pollReady(left),900)
}
function renderLib(){
  const ids=Object.keys(P.media);$("libn").textContent=ids.length?ids.length+"개":"";const box=$("libl");
  if(!ids.length){box.innerHTML='<div class="empty">영상을 열면 여기에 쌓입니다.<br>눌러서 타임라인 끝에 붙입니다.</div>';return}
  box.innerHTML="";
  for(const id of ids){const m=P.media[id],d=document.createElement("div");d.className="mi";const th=THUMBS[id]&&THUMBS[id][0];
    d.innerHTML=`<img ${th?`src="${th.u}"`:""}><div class="nm"><div>${esc(m.name)}</div><div class="st">${fmt(m.dur)} · ${m.w}×${m.h}${m.audio?" · 🔊":""}${URLS[id]?"":" · 미리보기 준비 중…"}</div></div>`;
    d.title="눌러서 타임라인 끝에 추가";d.onclick=()=>{appendClip(id);toast("타임라인 끝에 추가했습니다.")};box.appendChild(d)}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 썸네일(타임라인 필름) — 화면 밖 비디오로 구간별로 찍는다 */
async function makeThumbs(mid){
  THUMBS[mid]=[];const m=P.media[mid];let wait=0;while(!URLS[mid]&&wait++<400)await new Promise(r=>setTimeout(r,300));if(!URLS[mid])return;
  for(const n of [6,Math.min(40,Math.max(10,Math.ceil(m.dur/1.5)))]){
    try{const r=await API.thumbs(mid,n);if(r&&r.length){THUMBS[mid]=r;renderLib();renderTL()}}catch(e){}}
}
/* ================= 재생 엔진 ================= */
const vid=$("vid"),cv=$("cv"),ctx=cv.getContext("2d");let curSrc="",curClip=null,seekTok=0,clock=0,T0=0,raf=0;
function clipAt(t){const L=layout();for(const o of L)if(t<o.e-1e-6||o===L[L.length-1])if(t>=o.s-1e-6||o===L[0])return o;return L[L.length-1]}
function srcTime(o,t){return o.c.in+clamp((t-o.s)*speedOf(o.c),0,o.c.out-o.c.in)}
function setSrc(mid){const u=URLS[mid];if(!u)return false;if(curSrc!==u){curSrc=u;vid.src=u}return true}
function seek(t){
  T=clamp(t,0,Math.max(0,total()));const o=clipAt(T);const tok=++seekTok;
  if(!o){drawFrame();updTC();return}
  curClip=o.c;vid.muted=true;if(!setSrc(o.c.mid)){drawFrame();updTC();return}
  const want=srcTime(o,T),go=()=>{if(tok!==seekTok)return;if(Math.abs(vid.currentTime-want)<.02){drawFrame();return}vid.onseeked=()=>{if(tok===seekTok)drawFrame()};vid.currentTime=want};
  if(vid.readyState>=1)go();else vid.onloadedmetadata=go;
  drawFrame();updTC();placePH();
}
function play(){
  if(playing){pause();return}if(!P.clips.length)return;if(T>=total()-.02)T=0;
  playing=true;$("bPlay").textContent="❚❚";$("bPlay").classList.remove("p");T0=T;clock=performance.now();
  const o=clipAt(T);if(!setSrc(o.c.mid)){pause();return}curClip=o.c;applyClipPlay(o);raf=requestAnimationFrame(loop)}
function applyClipPlay(o){const c=o.c;vid.muted=false;vid.volume=clamp(c.mute||!P.media[c.mid].audio?0:(c.vol??1),0,1);vid.playbackRate=clamp(speedOf(c),.0625,16);
  const want=srcTime(o,T);const go=()=>{vid.currentTime=want;vid.play().catch(()=>{})};if(vid.readyState>=1)go();else vid.onloadedmetadata=go}
function pause(){playing=false;cancelAnimationFrame(raf);$("bPlay").textContent="▶";$("bPlay").classList.add("p");vid.pause();seek(T)}
function loop(){
  if(!playing)return;const now=performance.now();T=T0+(now-clock)/1000;
  const tot=total();let o=clipAt(T);
  if($("loopSel").checked&&SEL&&SEL.t==="c"){const L=layout().find(x=>x.c.id===SEL.id);if(L&&T>=L.e){T=L.s;T0=T;clock=now;o=L;applyClipPlay(o)}}
  if(T>=tot){T=tot;pause();return}
  if(o.c!==curClip){curClip=o.c;setSrc(o.c.mid);applyClipPlay(o)}
  else{const want=srcTime(o,T);if(Math.abs(vid.currentTime-want)>.35)vid.currentTime=want}
  drawFrame();updTC();placePH(true);raf=requestAnimationFrame(loop)}
function updTC(){$("tc").textContent=fmt(T)+" / "+fmt(total())}

/* ================= 미리보기 그리기 ================= */
const FIT={w:0,h:0};
function sizeStage(){
  const st=$("stage"),ar=P.canvas.w/P.canvas.h,bw=st.clientWidth-4,bh=st.clientHeight-4;let w=bw,h=bw/ar;if(h>bh){h=bh;w=bh*ar}
  cv.style.width=Math.floor(w)+"px";cv.style.height=Math.floor(h)+"px";const pw=Math.min(P.canvas.w,1280),ph=Math.round(pw/ar);
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph}
}
const MT=document.createElement("canvas"),mtc=MT.getContext("2d");
let LAST={tbox:{}};
function fontCss(path){const f=FONTS.find(f=>f.path===path);return f?f.name:"Malgun Gothic"}
function drawFrame(){
  const cw=cv.width,ch=cv.height;ctx.fillStyle="#000";ctx.fillRect(0,0,cw,ch);
  const o=P.clips.length?clipAt(T):null;
  if(o&&vid.videoWidth){const c=o.c,vw=vid.videoWidth,vh=vid.videoHeight,cr=c.crop||{};
    const l=cr.l||0,t=cr.t||0,r=cr.r||0,b=cr.b||0,sx=l*vw,sy=t*vh,sw=Math.max(2,(1-l-r)*vw),sh=Math.max(2,(1-t-b)*vh),rot=((c.rot||0)%360+360)%360,odd=rot===90||rot===270;

    <div class="sec"><b>표시 시간</b></div><div class="row"><label>시작</label><input type="number" step=".01" data-k="start" style="width:72px"><button id="tS">지금</button><label style="width:auto">끝</label><input type="number" step=".01" data-k="end" style="width:72px"><button id="tE">지금</button></div>`}
const gp=(o,k)=>k.split(".").reduce((a,x)=>a==null?a:a[x],o);
function sp_(o,k,v){const a=k.split(".");let t=o;for(let i=0;i<a.length-1;i++){t[a[i]]=t[a[i]]||{};t=t[a[i]]}t[a[a.length-1]]=v}
const PCT=new Set(["vol","crop.l","crop.r","crop.t","crop.b","x","y","w","h"]);
function vtxt(k,v,u){if(u==="%"&&PCT.has(k))return Math.round(v*100)+"%";if(u==="%")return (+v).toFixed(1)+"%";return (+v).toFixed(u==="s"||u==="x"?2:0).replace(/\.00$/,"")+u}
let boundKey="";
function bindProps(onlyValues){
  const o=SEL?find(SEL):P,root=$("pbody");
  root.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k,v=gp(o,k);
    if(el.classList.contains("tg")){el.classList.toggle("on",!!v);return}
    if(el===document.activeElement&&onlyValues)return;
    if(el.type==="checkbox")el.checked=!!v;else if(v!=null){el.value=v;if(el.tagName==="SELECT"&&el.value!==String(v)&&k==="font"){/* 목록에 없는 글꼴 */}}});
  root.querySelectorAll("[data-v]").forEach(s=>{const k=s.dataset.v,v=gp(o,k);s.textContent=v==null?"":vtxt(k,v,s.dataset.u)});
  if(!onlyValues&&!SEL){const pr=$("pPre");if(pr)pr.value=P.canvas.w+"x"+P.canvas.h}
}
function wireProps(){
  const o=SEL?find(SEL):P,root=$("pbody");
  root.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;
    if(el.classList.contains("tg")){el.onclick=()=>{sp_(o,k,!gp(o,k));touch(true);bindProps(true)};return}
    const h=()=>{let v=el.type==="checkbox"?el.checked:el.type==="range"||el.type==="number"?+el.value:el.value;
      if(SEL&&SEL.t==="c"&&(k==="in"||k==="out")){v=clamp(v,0,P.media[o.mid].dur)}
      sp_(o,k,v);if(k==="canvas.fit"||k==="fps"){} touch();if(SEL&&SEL.t==="c")seek(T);else drawFrame();bindProps(true)};
    el.addEventListener("input",h);el.addEventListener("change",()=>{touch(true)})});
  const $$=(id,f)=>{const e=root.querySelector("#"+id);if(e)e.onclick=f};
  $$("pSplit",splitAt);$$("pDup",dupSel);$$("pDel",delSel);
  $$("rotR",()=>{o.rot=((o.rot||0)+90)%360;touch(true);seek(T)});$$("rotL",()=>{o.rot=((o.rot||0)+270)%360;touch(true);seek(T)});
  $$("tS",()=>{o.start=+T.toFixed(2);if(o.end<o.start+.1)o.end=o.start+.1;touch(true);bindProps(true)});$$("tE",()=>{o.end=Math.max(+T.toFixed(2),o.start+.1);touch(true);bindProps(true)});
  $$("pFont",async()=>{const f=await API.pick_font();if(!f)return;await loadFont(f);FONTS.push(f);o.font=f.path;touch(true);renderProps()});
  $$("applyAll",()=>{P.texts.forEach(t=>{for(const k of["font","size","color","stroke","strokeW","bold","italic","shadow","spacing"])t[k]=o[k]});touch(true);toast("모든 문구에 스타일을 적용했습니다.")});
  root.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{o.speed=+b.dataset.sp;touch(true);bindProps(true);seek(T)});
  root.querySelectorAll("[data-cr]").forEach(b=>b.onclick=()=>{const m=P.media[o.mid],ar=+b.dataset.cr,cr=o.crop;cr.l=cr.r=cr.t=cr.b=0;
    if(ar){const sar=m.w/m.h;if(ar<sar){const k=(1-ar/sar)/2;cr.l=cr.r=+k.toFixed(4)}else{const k=(1-sar/ar)/2;cr.t=cr.b=+k.toFixed(4)}}touch(true);bindProps(true);drawFrame()});
  const pre=root.querySelector("#pPre");if(pre)pre.onchange=()=>{const[w,h]=pre.value.split("x").map(Number);P.canvas.w=w;P.canvas.h=h;touch(true);sizeStage();seek(T)};
  const fs=root.querySelector('select[data-k="font"]');if(fs&&o.font&&![...fs.options].some(x=>x.value===o.font)){const op=document.createElement("option");op.value=o.font;op.textContent=o.font.split(/[\\/]/).pop();fs.appendChild(op);fs.value=o.font}
}
function renderProps(){
  $("ph3").textContent=!SEL||!find(SEL)?"프로젝트":SEL.t==="c"?"클립 속성":SEL.t==="t"?"문구 속성":"모자이크 속성";
  $("pbody").innerHTML=propHtml();wireProps();bindProps(false)}
async function loadFont(f){if(!f.url)return;try{const ff=new FontFace(f.name,`url("${f.url}")`);await ff.load();document.fonts.add(ff)}catch(e){}}

function render(){renderTL();renderProps();sizeStage();drawFrame();updTC();updUndo();
  $("pvinfo").textContent=P.canvas.w+"×"+P.canvas.h+" · "+P.fps+"fps";["bSplit","bDup","bDel"].forEach(i=>$(i).disabled=i==="bSplit"?!P.clips.length:!SEL)}

/* ================= 상단 버튼 / 단축키 ================= */
$("bOpen").onclick=openFiles;$("bUndo").onclick=undo;$("bRedo").onclick=redo;$("bPlay").onclick=play;
$("bSplit").onclick=splitAt;$("bDup").onclick=dupSel;$("bDel").onclick=delSel;$("bText").onclick=addText;$("bMos").onclick=addMos;
const fr=()=>1/(P.fps||30);
$("bPrev").onclick=()=>{pause_();seek(T-fr())};$("bNext").onclick=()=>{pause_();seek(T+fr())};
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!(e.target.type==="range"||e.target.type==="checkbox"))return;
  if(document.querySelector(".modal.on"))return;const k=e.key,ctl=e.ctrlKey||e.metaKey;
  if(ctl&&(k==="z"||k==="Z")){e.shiftKey?redo():undo();e.preventDefault()}else if(ctl&&(k==="y"||k==="Y")){redo();e.preventDefault()}
  else if(ctl&&(k==="d"||k==="D")){dupSel();e.preventDefault()}else if(ctl&&(k==="s"||k==="S")){saveProject();e.preventDefault()}
  else if(k===" "){play();e.preventDefault()}else if(k==="s"||k==="S"){splitAt()}
  else if(k==="Delete"||k==="Backspace"){delSel();e.preventDefault()}
  else if(k==="ArrowLeft"){pause_();seek(T-(e.shiftKey?1:fr()));e.preventDefault()}else if(k==="ArrowRight"){pause_();seek(T+(e.shiftKey?1:fr()));e.preventDefault()}
  else if(k==="Home"){pause_();seek(0)}else if(k==="End"){pause_();seek(total())}
  else if(k==="+"||k==="="){setZoom(PPS*1.25)}else if(k==="-"){setZoom(PPS/1.25)}
  else if(k==="t"||k==="T"){addText()}else if(k==="m"||k==="M"){addMos()}else if(k==="Escape"){SEL=null;render()}
});
window.addEventListener("resize",()=>{sizeStage();drawFrame();renderTL()});

/* ================= 프로젝트 저장/열기 ================= */
async function saveProject(){const r=await API.save_project(P);if(r)toast("프로젝트를 저장했습니다: "+r)}
async function applyProject(pr){
  P=Object.assign({canvas:{w:1280,h:720,fit:"fit"},fps:30,media:{},clips:[],texts:[],mosaics:[]},pr);SEL=null;T=0;
  const res=await API.reopen_media(Object.values(P.media).map((m,i)=>({id:Object.keys(P.media)[i],path:m.path})));
  const miss=[];for(const id of Object.keys(P.media)){const r=res[id];if(r&&r.ok){URLS[id]=r.url;Object.assign(P.media[id],{dur:r.dur,w:r.w,h:r.h,audio:r.audio});if(!THUMBS[id])makeThumbs(id)}else miss.push(P.media[id].name)}
  hist=[];hpos=-1;pushHist();render();seek(0);renderLib();$("bFit").click();pollReady(Object.keys(P.media).filter(id=>res[id]&&res[id].ok&&!res[id].ready));
  if(miss.length)toast("찾을 수 없는 파일: "+miss.join(", "),6000)}
$("bProjOpen").onclick=async()=>{const r=await API.open_project();if(r)applyProject(r)};$("bProjSave").onclick=saveProject;
$("bRestore").onclick=async()=>{const r=await API.load_autosave();if(r)applyProject(r);$("bRestore").style.display="none"};

/* ================= 내보내기 ================= */
const XW={mp4:[0,1920,1280,854,640],gif:[480,360,320,240,200,0],webp:[480,360,320,240,200,0]};
function fillExp(){const f=$("xFmt").value;document.querySelectorAll("[data-f]").forEach(e=>e.style.display=e.dataset.f===f?"":"none");
  const keep=$("xW").value;$("xW").innerHTML=XW[f].map(w=>`<option value="${w}">${w?w+" px":"프로젝트 크기 ("+P.canvas.w+" px)"}</option>`).join("");if([...$("xW").options].some(o=>o.value===keep))$("xW").value=keep;
  if(f!=="mp4"&&+$("xFps").value>30)$("xFps").value=15;if(f==="mp4"&&!$("xFps").dataset.u)$("xFps").value=P.fps;
  const w=+$("xW").value||P.canvas.w;$("xWh").textContent=" → "+(w%2?w+1:w)+"×"+Math.round(w*P.canvas.h/P.canvas.w/2)*2;
  $("xInfo").textContent="길이 "+fmt(total())+(f!=="mp4"?" · 긴 영상은 용량이 매우 커집니다 (디시콘은 200px 권장)":"")}
$("xFmt").onchange=()=>{$("xFps").dataset.u="";if($("xFmt").value!=="mp4")$("xFps").value=15;else $("xFps").value=P.fps;fillExp()};$("xW").onchange=fillExp;$("xFps").oninput=()=>$("xFps").dataset.u="1";
$("bExport").onclick=()=>{if(!P.clips.length){toast("타임라인에 영상이 없습니다.");return}pause_();$("expForm").style.display="";$("expRun").style.display="none";$("xFps").dataset.u="";fillExp();$("mExp").classList.add("on")};
$("xCancel").onclick=()=>$("mExp").classList.remove("on");$("xClose").onclick=()=>$("mExp").classList.remove("on");
let expTimer=null,expOut="";
$("xGo").onclick=async()=>{
  const f=$("xFmt").value,o={fmt:f,w:+$("xW").value,fps:+$("xFps").value||P.fps,crf:+$("xQ").value,audio:$("xAudio").checked,gifq:$("xGq").value,q:+$("xWq").value};
  const base=(P.clips[0]&&P.media[P.clips[0].mid]?P.media[P.clips[0].mid].name.replace(/\.[^.]+$/,""):"영상")+"_편집";
  const out=await API.pick_out(f,base);if(!out)return;o.out=out;expOut=out;
  $("expForm").style.display="none";$("expRun").style.display="";$("xStop").style.display="";$("xOpen").style.display="none";$("xClose").style.display="none";$("xBar").style.width="0";$("xMsg").textContent="준비 중…";
  const r=await API.export(P,o);if(r&&r.error){$("xMsg").textContent="오류: "+r.error;$("xClose").style.display="";$("xStop").style.display="none";return}
  expTimer=setInterval(async()=>{const s=await API.export_status();$("xBar").style.width=s.pct+"%";
    $("xMsg").textContent=s.state==="run"?`${s.msg} ${Math.round(s.pct)}%`+(s.eta?` · 약 ${s.eta}초 남음`:""):s.state==="done"?`완료 · ${(s.size/1048576).toFixed(1)}MB\n${s.out}`:s.msg;
    $("xMsg").style.whiteSpace="pre-wrap";
    if(s.state!=="run"){clearInterval(expTimer);$("xStop").style.display="none";$("xClose").style.display="";if(s.state==="done")$("xOpen").style.display=""}},500)};
$("xStop").onclick=()=>API.export_cancel();$("xOpen").onclick=()=>API.reveal(expOut);

/* ================= 시작 ================= */
(async()=>{
  await ready;sizeStage();pushHist();render();
  try{FONTS=await API.fonts()||[];for(const f of FONTS)if(f.url)loadFont(f)}catch(e){}
  try{if(await API.has_autosave())$("bRestore").style.display=""}catch(e){}
  window.__ve={get P(){return P},get T(){return T},set P(v){P=v},seek,splitAt,openFiles,addText,addMos,select,delSel,play,pause,undo,redo,render,get SEL(){return SEL},layout,total,URLS,THUMBS,touch,setZoom,get PPS(){return PPS}};
})();
